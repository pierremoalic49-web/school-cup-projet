# Vérification automatique à chaque envoi sur GitHub : le site compile-t-il et les tests passent-ils ?
# (Le modèle d'origine « NodeJS with Webpack » ne convenait pas : le site utilise Vite et se trouve dans site/.)
name: Vérification du site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installation
        run: npm ci

      - name: Tests (tableau, buts, qualification, photos…)
        run: npm test

      - name: Compilation (typage + version en ligne)
        run: npm run build

  # Publication sur GitHub Pages (seulement après un envoi sur main, si les tests sont passés).
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Compilation pour l'adresse /school-cup-projet/
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages ne connaît que des fichiers : la page « 404 » renvoie le site, ce qui fait marcher /admin.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
