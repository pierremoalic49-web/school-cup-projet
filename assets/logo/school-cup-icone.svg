,202.4 256.4,202.4 261.8,219.2 247.6,229.5"/><polygon points="220.6,258.3 238.2,258.3 243.7,275.1 229.4,285.5 215.1,275.1"/><polygon points="179.4,258.3 184.9,275.1 170.6,285.5 156.3,275.1 161.8,258.3"/><polygon points="166.7,219.2 152.4,229.5 138.2,219.2 143.6,202.4 161.3,202.4"/></g><path d="M200.0 215.0 L200.0 195.0 M214.3 225.4 L233.3 219.2 M208.8 242.1 L220.6 258.3 M191.2 242.1 L179.4 258.3 M185.7 225.4 L166.7 219.2" stroke="#0A1230" stroke-width="3"/><rect x="140" y="178" width="120" height="112" fill="url(#irgloss)"/></g><path d="M156 188 C156 236 170 266 190 282" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/><path d="M168 188 C168 222 176 246 186 262" fill="none" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/><rect x="132" y="171" width="136" height="12" rx="4" fill="#4A3102"/><rect x="132" y="169" width="136" height="12" rx="4" fill="url(#irgoldH)" filter="url(#irbevelSoft)"/><rect x="138" y="170.5" width="70" height="2" rx="1" fill="#FFFFFF" opacity=".7"/><path d="M192 290 L208 290 L211 304 L189 304 Z" fill="url(#irgoldH)" filter="url(#irbevelSoft)"/><ellipse cx="200" cy="306" rx="14" ry="5" fill="url(#irgoldH)" filter="url(#irbevelSoft)"/><path d="M166 312 L234 312 L243 336 L157 336 Z" fill="url(#irgoldH)" filter="url(#irbevel)"/><path d="M168 314 L232 314" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.5"/><rect x="150" y="336" width="100" height="10" rx="2" fill="#2A1C01"/><rect x="150" y="335" width="100" height="9" rx="2" fill="url(#irgoldH)" filter="url(#irbevelSoft)"/></g><polygon points="150.00,376.00 152.51,382.04 159.04,382.56 154.07,386.82 155.58,393.19 150.00,389.77 144.42,393.19 145.93,386.82 140.96,382.56 147.49,382.04" fill="#4A3102"/><polygon points="150.00,374.50 152.51,380.54 159.04,381.06 154.07,385.32 155.58,391.69 150.00,388.27 144.42,391.69 145.93,385.32 140.96,381.06 147.49,380.54" fill="url(#irgoldV)" filter="url(#irbevelSoft)"/><polygon points="200.0